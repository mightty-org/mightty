# Pushing a version tag (v0.2.0) builds Mightty.app for Apple Silicon and
# Intel, signs it with the Developer ID, has Apple notarize it, and attaches
# it to a GitHub Release as Mightty.dmg (and Mightty.zip). The website's
# download button links to releases/latest/download/Mightty.dmg. The secrets
# it needs are in RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # The signing secrets belong to this environment, which can require a
    # reviewer's approval before the job starts (see RELEASING.md).
    environment: release
    steps:
      # Pinned to a commit, as everything here runs beside the signing keys.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag can point anywhere, a branch nobody reviewed included: only
      # what was merged to main gets signed.
      - name: Check the tag is on main and is Cargo.toml's version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't a commit on main"
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi

      - run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - run: cargo test --workspace

      # Into a keychain of the job's own, deleted at the end.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"

      - run: scripts/bundle.sh --universal --sign "$IDENTITY"

      # The app first, so the ticket is stapled to it before it goes into
      # the disk image, then the image itself. notarytool exits 0 whatever
      # Apple decides, so the status is checked, and Apple's log shown when
      # it isn't Accepted.
      - name: Notarize and package
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key=$RUNNER_TEMP/notary.p8
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$key"
          notarize() {
            xcrun notarytool submit "$1" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
            cat "$RUNNER_TEMP/notary.json"
            if [ "$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")" != Accepted ]; then
              xcrun notarytool log "$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")" \
                --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
              exit 1
            fi
          }
          app=target/release/Mightty.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/submit.zip"
          notarize "$RUNNER_TEMP/submit.zip"
          xcrun stapler staple "$app"
          spctl --assess --verbose=2 "$app"

          scripts/make-dmg.sh --sign "$IDENTITY" "$app" Mightty.dmg
          notarize Mightty.dmg
          xcrun stapler staple Mightty.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 Mightty.dmg

          # The zip too, for scripts that want the app without mounting anything.
          ditto -c -k --keepParent "$app" Mightty.zip
          shasum -a 256 Mightty.dmg Mightty.zip > SHA256SUMS

      # A tag with a hyphen (v0.2.0-beta.1) is a pre-release, which
      # releases/latest skips.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" Mightty.dmg Mightty.zip SHA256SUMS \
            --title "Mightty ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag $prerelease

      - name: Delete the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
