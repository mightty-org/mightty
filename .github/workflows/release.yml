# Makes a release. Started by hand (Actions > Release > Run workflow) with
# the part of the version to raise: it sets the new version in Cargo.toml
# and Cargo.lock, builds Mightty.app for Apple Silicon and Intel, signs it
# with the Developer ID, has Apple notarize it, pushes the version's commit
# and tag to main, and publishes a GitHub Release with notes GitHub writes
# from the pull requests merged since the last one. The website's download
# button links to releases/latest/download/Mightty.dmg. The secrets it
# needs are in RELEASING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write

# One at a time: two would both try to take the next version.
concurrency: release

jobs:
  release:
    runs-on: macos-15
    # The signing secrets and the key that may push to main belong to this
    # environment, which can require a reviewer's approval before the job
    # starts (see RELEASING.md).
    environment: release
    steps:
      # Only main is released: every change there came through a pull request.
      - name: Check this is main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::releases are made from main, not $GITHUB_REF_NAME"
            exit 1
          fi

      # Pinned to a commit, as everything here runs beside the signing keys.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The version and targets rust-toolchain.toml names.
      - run: rustup toolchain install

      # Committed and tagged here, pushed only once the build is signed and
      # notarized: a release that fails leaves nothing behind.
      - name: Set the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          old=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          major=${old%%.*} rest=${old#*.}
          minor=${rest%%.*} patch=${rest#*.}
          case $BUMP in
            major) version=$((major + 1)).0.0 ;;
            minor) version=$major.$((minor + 1)).0 ;;
            patch) version=$major.$minor.$((patch + 1)) ;;
            *) echo "::error::unknown bump $BUMP"; exit 1 ;;
          esac
          if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is tagged already"
            exit 1
          fi
          sed -i '' "s/^version = \"$old\"/version = \"$version\"/" Cargo.toml
          # The lock file names each crate's version too.
          cargo update --quiet --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "Version $version"
          git tag "v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "### Mightty $version (was $old)" >> "$GITHUB_STEP_SUMMARY"

      - run: cargo test --workspace

      # Into a keychain of the job's own, deleted at the end.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"

      - run: scripts/bundle.sh --universal --sign "$IDENTITY"

      # The app first, so the ticket is stapled to it before it goes into
      # the disk image, then the image itself. notarytool exits 0 whatever
      # Apple decides, so the status is checked, and Apple's log shown when
      # it isn't Accepted.
      - name: Notarize and package
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key=$RUNNER_TEMP/notary.p8
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$key"
          notarize() {
            xcrun notarytool submit "$1" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
            cat "$RUNNER_TEMP/notary.json"
            if [ "$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")" != Accepted ]; then
              xcrun notarytool log "$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")" \
                --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
              exit 1
            fi
          }
          app=target/release/Mightty.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/submit.zip"
          notarize "$RUNNER_TEMP/submit.zip"
          xcrun stapler staple "$app"
          spctl --assess --verbose=2 "$app"

          scripts/make-dmg.sh --sign "$IDENTITY" "$app" Mightty.dmg
          notarize Mightty.dmg
          xcrun stapler staple Mightty.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 Mightty.dmg

          # The zip too, for scripts that want the app without mounting anything.
          ditto -c -k --keepParent "$app" Mightty.zip
          shasum -a 256 Mightty.dmg Mightty.zip > SHA256SUMS

      # main takes changes by pull request and v* tags are for admins to
      # make: the rulesets let this one key past both, and it is only here,
      # after everything else has passed. Commit and tag go together or not
      # at all; if main has moved on since the job began, neither does.
      - name: Push the version and its tag
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          key=$RUNNER_TEMP/deploy-key
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key")
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push --atomic "git@github.com:$GITHUB_REPOSITORY.git" HEAD:main "v$VERSION"

      # Notes as GitHub writes them: the pull requests merged since the
      # last release, grouped as .github/release.yml says.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Mightty.dmg Mightty.zip SHA256SUMS \
            --title "Mightty $VERSION" --generate-notes --verify-tag

      - name: Delete the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
